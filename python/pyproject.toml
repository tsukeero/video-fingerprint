[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-fingerprint"
version = "0.1.0"
description = "fp1 quick fingerprint for large video files (size + 3 sampled 64 KiB chunks, BLAKE3)"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["blake3>=0.4"]

[tool.setuptools]
packages = ["video_fingerprint"]
