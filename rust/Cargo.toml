[package]
name = "video-fingerprint"
version = "0.1.0"
edition = "2021"
description = "fp1 quick fingerprint for large video files (size + 3 sampled 64 KiB chunks, BLAKE3)"
publish = false

[dependencies]
blake3 = "1.8"

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "vfp"
path = "src/main.rs"
